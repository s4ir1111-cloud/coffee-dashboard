name: Monthly Management Report

on:
  schedule:
    # 5-го числа в 06:15 по Тюмени (01:15 UTC), за предыдущий завершённый месяц.
    - cron: '15 1 5 * *'
  workflow_dispatch:
    inputs:
      month:
        description: 'Месяц отчёта YYYY-MM (пусто = предыдущий завершённый)'
        required: false
        type: string

concurrency:
  group: monthly-management-report
  cancel-in-progress: false

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Build report
        env:
          REPORT_MONTH: ${{ inputs.month }}
        run: |
          if [ -n "$REPORT_MONTH" ]; then
            python build_monthly_report.py --month "$REPORT_MONTH"
          else
            python build_monthly_report.py
          fi

      - name: Commit report for GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add monthly_report.html monthly_report.json telegram_monthly_report.txt
          git pull --rebase --autostash origin main
          git add monthly_report.html monthly_report.json telegram_monthly_report.txt
          git diff --staged --quiet || git commit -m "report: monthly management update"
          git push

      - name: Send Telegram summary
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python send_telegram_report.py
