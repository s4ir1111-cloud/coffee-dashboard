name: Update Dashboard Data

on:
  schedule:
    # Уводим запуски с :00/:15/:30/:45 — в эти минуты GitHub чаще
    # задерживает или отбрасывает scheduled jobs из-за общей нагрузки.
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    # Резервный запуск при успешном обновлении соседних отчётов.
    # Файлы самого дашборда не включены, поэтому рекурсии не будет.
    paths:
      - 'finance_data.json'
      - 'pnl_data.json'
      - 'operational_alerts.json'
      - 'guest_cdp_data.json'
      - '.github/workflows/update_dashboard.yml'
  workflow_dispatch:  # ручной запуск из интерфейса GitHub

jobs:
  update:
    runs-on: ubuntu-latest
    concurrency:
      group: update-dashboard-data
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch IIKO data
        env:
          IIKO_HOST: ${{ secrets.IIKO_HOST }}
          IIKO_LOGIN: ${{ secrets.IIKO_LOGIN }}
          IIKO_PASSWORD: ${{ secrets.IIKO_PASSWORD }}
          DASHBOARD_TIMEZONE: Asia/Yekaterinburg
        run: python iiko_resto_connector.py

      - name: Build dashboard data
        run: python build_dashboard_data.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard_data_view.json dashboard_data.json
          git diff --staged --quiet || git commit -m "data: update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
