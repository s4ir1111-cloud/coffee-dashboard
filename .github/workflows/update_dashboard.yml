name: Update Dashboard Data

on:
  workflow_call:
  schedule:
    # Первый из четырёх независимых планировщиков. Остальные находятся
    # в dashboard_schedule_*.yml и вызывают этот workflow повторно.
    - cron: '7 * * * *'
  # Любое обновление соседнего отчёта становится дополнительным независимым
  # сигналом. Файлы самого дашборда исключены, поэтому рекурсии нет.
  push:
    paths:
      - finance_data.json
      - finance_data_raw.json
      - pnl_data.json
      - pnl_data_raw.json
      - guest_cdp_data.json
      - operational_alerts.json
      - expense_monitoring_summary.csv
  # Резервные события: эти отчёты имеют собственные расписания. Их завершение
  # запускает продажи даже тогда, когда GitHub пропустил все dashboard cron.
  workflow_run:
    workflows:
      - Update Finance Data
      - Update P&L Data
      - Update Guest CDP
      - Operational Purchase and Usage Monitor
    types: [completed]
  workflow_dispatch:  # ручной запуск из интерфейса GitHub

jobs:
  update:
    runs-on: ubuntu-latest
    concurrency:
      group: update-dashboard-data
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Resolve IIKO host via DNS-over-HTTPS
        run: |
          IIKO_IP=$(python -c "import requests; data=requests.get('https://dns.google/resolve', params={'name':'kofeinya-garden-co.iiko.it','type':'A'}, timeout=20).json(); print(next(row['data'] for row in data.get('Answer', []) if row.get('type') == 1))")
          test -n "$IIKO_IP"
          echo "$IIKO_IP kofeinya-garden-co.iiko.it" | sudo tee -a /etc/hosts > /dev/null

      - name: Fetch IIKO data
        env:
          IIKO_HOST: ${{ secrets.IIKO_HOST }}
          IIKO_LOGIN: ${{ secrets.IIKO_LOGIN }}
          IIKO_PASSWORD: ${{ secrets.IIKO_PASSWORD }}
          DASHBOARD_TIMEZONE: Asia/Yekaterinburg
        run: python iiko_resto_connector.py

      - name: Build dashboard data
        run: python build_dashboard_data.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard_data_view.json dashboard_data.json
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -m "data: update $(date -u '+%Y-%m-%d %H:%M UTC')"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "Не удалось опубликовать данные после 4 попыток" >&2
          exit 1
