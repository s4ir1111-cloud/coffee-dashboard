name: Operational Purchase and Usage Monitor

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch: {}

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Calculate operational alerts
        run: python operational_monitor.py
      - name: Install Telegram dependency
        run: pip install requests
      - name: Send material alerts to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_FILE: telegram_operational_alerts.txt
        run: |
          if grep -q '^NO_ALERTS$' telegram_operational_alerts.txt; then
            echo "No operational alerts"
          else
            python send_telegram_report.py
          fi
      - name: Save alert history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add operational_alerts.json telegram_operational_alerts.txt reports/operational/alert_history.json
          git pull --rebase --autostash origin main
          git add operational_alerts.json telegram_operational_alerts.txt reports/operational/alert_history.json
          git diff --staged --quiet || git commit -m "monitor: update operational alerts"
          git push
