name: Probe iiko Source Fields

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'probe_iiko_sources.py'
      - '.github/workflows/probe_iiko_sources.yml'

concurrency:
  group: probe-iiko-sources
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Read safe iiko schema metadata
        env:
          IIKO_HOST: ${{ secrets.IIKO_HOST }}
          IIKO_LOGIN: ${{ secrets.IIKO_LOGIN }}
          IIKO_PASSWORD: ${{ secrets.IIKO_PASSWORD }}
        run: python probe_iiko_sources.py
      - name: Save probe result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add iiko_source_probe.json
          git pull --rebase --autostash origin main
          git add iiko_source_probe.json
          git diff --staged --quiet || git commit -m "probe: update iiko source fields"
          git push
