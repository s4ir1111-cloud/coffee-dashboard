name: Update Guest CDP

on:
  # Ежедневно в 06:15 по Москве (03:15 UTC).
  schedule:
    - cron: '15 3 * * *'

  # Ручной запуск из GitHub Actions или через GitHub CLI/API.
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Окно активности для RFM, дней'
        required: false
        default: '100'
        type: string

permissions:
  contents: write

concurrency:
  group: guest-cdp-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Загрузить свежие данные из iiko
        env:
          IIKO_LOGIN: ${{ secrets.IIKO_LOGIN }}
          IIKO_PASSWORD: ${{ secrets.IIKO_PASSWORD }}
          DAYS_BACK: ${{ inputs.days_back || '100' }}
        run: python3 build_guest_cdp_data.py --days-back "$DAYS_BACK"

      - name: Собрать дашборд (полные номера без маскировки)
        run: |
          python3 - << 'PYEOF'
          import json

          with open('guest_cdp_data.json', encoding='utf-8') as f:
              data_raw = f.read()
              data = json.loads(data_raw)

          guests = data.get('guests')
          if not isinstance(guests, list) or not guests:
              raise RuntimeError('iiko вернул пустой или некорректный список гостей; публикация отменена')

          with open('guest_cdp_dashboard_template.html', encoding='utf-8') as f:
              html = f.read()

          marker = '<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>'
          assert marker in html, "marker not found in template"

          dashboard_html = html.replace(marker, '<script>window.__GUEST_DATA__=' + data_raw + ';</script>\n' + marker, 1)
          with open('guest_cdp_dashboard.html', 'w', encoding='utf-8') as f:
              f.write(dashboard_html)

          print(f"Готово: {len(guests)} гостей; данные на {data.get('generated_at', 'неизвестную дату')}")
          PYEOF

      - name: Закоммитить и запушить
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add guest_cdp_dashboard.html
          if git diff --staged --quiet; then
            echo "Данные не изменились — коммит не нужен"
          else
            git commit -m "update guest cdp data [auto]"
            git push
          fi
